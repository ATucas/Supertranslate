services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    ports: ["${API_PORT:-3000}:3000"]
    environment: { API_PORT: 3000, API_HOST: 0.0.0.0 }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: 1000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.5-transcribe-live}
      GEMINI_TARGET_LANGUAGE: ${GEMINI_TARGET_LANGUAGE:-es}
    depends_on:
      api:
        condition: service_healthy
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on:
      api:
        condition: service_healthy
